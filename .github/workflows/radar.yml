# Atualiza o Radar da semana sozinho, toda segunda-feira por volta das 5h30 (Brasília).
# Também roda quando alguém publica mudança nas fontes ou no script do Radar (pasta radar/).
# Configuração única: em GitHub → Settings → Secrets and variables → Actions, crie o secret ANTHROPIC_API_KEY.
name: Radar semanal
on:
  schedule:
    - cron: "23 8 * * 1"  # segunda-feira, 08:23 UTC = 05:23 em Brasília (fora da hora cheia, menos fila no GitHub)
  push:
    branches: [main]
    paths: ["radar/**", ".github/workflows/radar.yml"]
  workflow_dispatch: {}    # permite rodar na hora pelo botão "Run workflow"
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Gerar radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node radar/atualizar.mjs
      - name: Publicar
        run: |
          git config user.name "Radar Nexalytix"
          git config user.email "radar@nexalytix.com.br"
          git add dist/radar.json
          git diff --cached --quiet && { echo "Sem mudanças"; exit 0; }
          git commit -m "Radar da semana: $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
