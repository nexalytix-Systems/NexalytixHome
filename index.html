// Webhook do Make.com: Webhook > módulo HTTP > CRM (com a LEADS_API_KEY guardada no Make).
const MAKE_WEBHOOK_URL = 'https://hook.us2.make.com/90feykiubeygac8dr56elwvipumu30th';

// Captura utm_source/utm_medium/utm_campaign/utm_term/utm_content da URL na primeira visita
// e guarda na sessão, para que o lead chegue no CRM já identificando a origem (Google Ads, Meta Ads, orgânico...).
function captureUtm(){
  try {
    const params = new URLSearchParams(window.location.search);
    const keys = ['utm_source','utm_medium','utm_campaign','utm_term','utm_content'];
    const found = {};
    let hasAny = false;
    keys.forEach(k => { const v = params.get(k); if (v) { found[k] = v; hasAny = true; } });
    if (hasAny) {
      sessionStorage.setItem('nexalytix_utm', JSON.stringify(found));
    }
  } catch (e) { /* sessionStorage indisponível — segue sem atribuição */ }
}
function getStoredUtm(){
  try {
    const raw = sessionStorage.getItem('nexalytix_utm');
    return raw ? JSON.parse(raw) : {};
  } catch (e) { return {}; }
}
function buildOrigem(){
  const utm = getStoredUtm();
  if (utm.utm_source) {
    return [utm.utm_source, utm.utm_medium, utm.utm_campaign].filter(Boolean).join(' / ');
  }
  return 'Site — Formulário de Contato';
}
captureUtm();

/* ---------- generic section builders ---------- */
function btn(label, href, variant){
  const base = 'inline-flex items-center justify-center gap-2 rounded-md px-5 py-3 text-sm font-semibold transition-colors focus-visible:outline-2';
  const styles = {
    primary: 'bg-primary text-primary-foreground hover:bg-primary/90',
    outline: 'border border-border bg-background text-foreground hover:bg-surface',
  };
  return `<a href="${href}" class="${base} ${styles[variant||'primary']}">${label}${ICON_ARROW}</a>`;
}

function header({eyebrow, title, lead}){
  return `<header class="max-w-3xl"><p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-accent-foreground/70"><span class="text-primary">${eyebrow}</span></p><h2 class="font-semibold text-3xl md:text-4xl">${title}</h2>${lead ? `<p class="mt-4 text-base leading-relaxed text-muted-foreground md:text-lg">${lead}</p>` : ''}</header>`;
}

function sHero({eyebrow, title, lead, ctas}){
  return `<section class="border-b border-border bg-background"><div class="container-page py-16 md:py-24"><p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">${eyebrow}</p><h1 class="mt-4 max-w-3xl text-4xl font-semibold leading-[1.08] md:text-5xl">${title}</h1><p class="mt-6 max-w-2xl text-lg leading-relaxed text-muted-foreground">${lead}</p>${ctas ? `<div class="mt-8 flex flex-wrap gap-3">${ctas.map(c=>btn(c.label,c.href,c.variant)).join('')}</div>` : ''}</div></section>`;
}

function sChallenge({eyebrow, title, paragraphs, bg}){
  return `<section class="py-16 md:py-24 ${bg}"><div class="container-page">${header({eyebrow,title})}<div class="mt-6 max-w-3xl space-y-4 text-base leading-relaxed text-muted-foreground">${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div></div></section>`;
}

}

}

function sChecklist({eyebrow, title, lead, items, bg}){

function partnerBadge(logoSrc, label){
  return `<div class="flex items-center justify-center rounded-lg border border-border bg-card px-6 py-6 shadow-soft"><img src="${logoSrc}" alt="${label}" class="h-8 w-auto max-w-[75%] object-contain" /></div>`;
}

function sPartnerIntro({logoSrc, logoAlt, eyebrow, title, paragraphs, bg}){
  return `<section class="py-16 md:py-24 ${bg}"><div class="container-page"><div class="flex items-start gap-4"><span class="flex h-14 w-14 shrink-0 items-center justify-center rounded-lg border border-border bg-card p-2 shadow-soft"><img src="${logoSrc}" alt="${logoAlt}" class="max-h-full max-w-full object-contain" /></span><div class="max-w-3xl"><p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-accent-foreground/70"><span class="text-primary">${eyebrow}</span></p><h2 class="font-semibold text-3xl md:text-4xl">${title}</h2></div></div><div class="mt-6 max-w-3xl space-y-4 text-base leading-relaxed text-muted-foreground">${paragraphs.map(p=>`<p>${p}</p>`).join('')}</div></div></section>`;
}

function sRadarTopic({num, kicker, title, intro, notes, linkLabel, linkHref, bg}){
  return `<section class="py-16 md:py-24 ${bg}"><div class="container-page"><div class="grid gap-10 lg:grid-cols-[0.9fr_1.1fr] lg:items-start">
    <div><p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">Radar 0${num} · ${kicker}</p><h2 class="mt-3 font-semibold text-3xl md:text-4xl">${title}</h2><p class="mt-4 text-base leading-relaxed text-muted-foreground">${intro}</p><div class="mt-6"><a href="${linkHref}" class="inline-flex items-center gap-2 text-sm font-semibold text-primary">${linkLabel}${ICON_ARROW}</a></div></div>
    <ul class="space-y-3">${notes.map(n=>`<li class="flex gap-3 rounded-lg border border-border bg-card p-4 shadow-soft text-sm leading-relaxed text-muted-foreground">${ICON_CHECK}<span>${n}</span></li>`).join('')}</ul>
  </div></div></section>`;
}

let faqUid = 0;
function sFaq({title, faqs, bg}){
  faqUid++;
  const groupId = 'faq-'+faqUid;
  return `<section class="py-16 md:py-24 ${bg||'bg-surface text-surface-foreground'}"><div class="container-page"><header class="max-w-3xl"><h2 class="font-semibold text-3xl md:text-4xl">${title||'Perguntas frequentes'}</h2></header><div class="mt-8 max-w-3xl" data-faq-group="${groupId}">${faqs.map((f,idx)=>`<div class="border-b"><h3 class="flex"><button type="button" aria-expanded="false" class="faq-btn flex flex-1 items-center justify-between py-4 cursor-pointer transition-all hover:underline text-left text-base font-semibold" data-faq-group="${groupId}" data-faq-idx="${idx}">${f.q}${ICON_CHEVRON}</button></h3><div class="faq-panel overflow-hidden text-sm" hidden><div class="pb-4 pt-0 text-sm leading-relaxed text-muted-foreground">${f.a}</div></div></div>`).join('')}</div></div></section>`;
}

function sEmptyState({eyebrow, title, lead, heading, body, ctaLabel, ctaHref, bg}){
  return `<section class="py-16 md:py-24 ${bg}"><div class="container-page">${eyebrow ? `<header class="max-w-3xl mx-auto text-center"><p class="mb-3 text-xs font-semibold uppercase tracking-[0.18em] text-accent-foreground/70"><span class="text-primary">${eyebrow}</span></p><h2 class="font-semibold text-3xl md:text-4xl">${title}</h2><p class="mt-4 text-base leading-relaxed text-muted-foreground md:text-lg">${lead}</p></header>` : ''}<div class="mt-8"><div class="rounded-lg border border-dashed border-border bg-surface p-10 text-center"><h3 class="text-lg font-semibold">${heading}</h3><p class="mx-auto mt-2 max-w-xl text-sm leading-relaxed text-muted-foreground">${body}</p><div class="mt-6 flex justify-center">${btn(ctaLabel, ctaHref, 'primary')}</div></div></div></div></section>`;
}

function sCtaBand({title, lead, ctas}){
  return `<section class="bg-ink text-ink-foreground"><div class="container-page py-16 md:py-20"><div class="max-w-3xl"><h2 class="text-3xl font-semibold md:text-4xl">${title}</h2><p class="mt-4 text-base leading-relaxed text-ink-foreground/75">${lead}</p><div class="mt-8 flex flex-wrap gap-3">${ctas.map(c=> c.variant==='ghost' ? `<a href="${c.href}" class="inline-flex items-center rounded-md border border-ink-foreground/25 px-5 py-3 text-sm font-semibold text-ink-foreground hover:bg-ink-foreground/10">${c.label}</a>` : btn(c.label,c.href,'primary')).join('')}</div></div></div></section>`;
}

function sLegal({title, updated, blocks}){
  return `<section class="py-16 md:py-24 bg-background"><div class="container-page max-w-3xl"><p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">Legal</p><h1 class="mt-4 text-3xl font-semibold md:text-4xl">${title}</h1><p class="mt-3 text-sm text-muted-foreground">Última atualização: ${updated}. Este é um modelo inicial e deve ser revisado por um advogado antes da publicação oficial.</p><div class="mt-8 space-y-8">${blocks.map(b=>`<div><h2 class="text-lg font-semibold">${b.heading}</h2><div class="mt-2 space-y-3 text-sm leading-relaxed text-muted-foreground">${b.body.map(p=>`<p>${p}</p>`).join('')}</div></div>`).join('')}</div></div></section>`;
}

        <div class="sm:col-span-1"><label for="cf-email" class="text-sm font-medium">E-mail</label><input id="cf-email" name="email" type="email" required class="mt-1.5 w-full rounded-md border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" placeholder="voce@empresa.com.br" /></div>
        <div class="sm:col-span-1"><label for="cf-phone" class="text-sm font-medium">Telefone (WhatsApp)</label><input id="cf-phone" name="phone" type="tel" required class="mt-1.5 w-full rounded-md border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" placeholder="(11) 99999-9999" /></div>
        <div class="sm:col-span-1"><label for="cf-company" class="text-sm font-medium">Empresa</label><input id="cf-company" name="company" class="mt-1.5 w-full rounded-md border border-border bg-background px-3 py-2.5 text-sm outline-none focus:border-primary" placeholder="Nome da empresa" /></div>

  sCardsGrid({eyebrow:'Portfólio e mercado', title:'Além do que desenvolvemos', lead:'Serviços, soluções SaaS próprias e produtos de parceiros, além de uma leitura curada do que está mudando no mercado de tecnologia.', bg:'bg-surface text-surface-foreground', cards:[

  sEmptyState({eyebrow:'Cases', title:'Tecnologia aplicada a problemas reais', lead:'Projetos publicados aparecem aqui com desafio, estratégia, solução e resultados.', bg:'bg-background text-foreground', heading:'Cases em publicação', body:'Estamos organizando os cases autorizados para publicação. Enquanto isso, podemos apresentar projetos semelhantes ao seu contexto em uma conversa.', ctaLabel:'Conversar sobre meu desafio', ctaHref:'/contato'}) +

  sCtaBand({title:'Pronto para saber o que priorizar primeiro?', lead:'O Diagnóstico Digital entrega um raio-x objetivo da sua operação, com os próximos passos claros. Respondemos o seu pedido em até 1 dia útil.', ctas:[{label:'Agendar Diagnóstico Digital', href:'/consultoria/diagnostico-digital', variant:'primary'},{label:'Falar com um especialista', href:'/contato', variant:'ghost'}]});

/* ============================= LAYOUT ============================= */
function headerHtml(){
  const navGroups = NAV_MEGA.map((g, gi) => {
    const wide = g.items.length > 4;
    const panelWidth = wide ? 'w-[560px] grid grid-cols-2 gap-1' : 'w-72';
    const itemsHtml = g.items.map(i => `<a href="${i.href}" class="block rounded-md px-3 py-2.5 hover:bg-surface"><span class="block text-sm font-semibold text-card-foreground">${i.label}</span><span class="mt-0.5 block text-xs leading-snug text-muted-foreground">${i.desc}</span></a>`).join('');
    const overviewHtml = g.href ? `<div class="${wide ? 'col-span-2' : ''} mt-2 border-t border-border pt-2"><a href="${g.href}" class="block rounded-md px-3 py-2 text-xs font-semibold text-primary hover:bg-surface">Ver visão geral ${ICON_ARROW}</a></div>` : '';
    return `<div class="relative"><button type="button" class="nav-trigger inline-flex items-center gap-1 rounded-md px-3 py-2 text-sm font-medium text-foreground hover:text-primary" aria-expanded="false" data-nav-idx="${gi}">${g.label}${ICON_CHEVRON}</button><div id="nav-panel-${gi}" class="dropdown-panel absolute left-0 top-full z-50 mt-2 ${panelWidth} rounded-lg border border-border bg-card p-3 shadow-lift" hidden>${itemsHtml}${overviewHtml}</div></div>`;
  }).join('');
  const mobileGroups = NAV_MEGA.map((g, gi) => {
    const itemsHtml = g.items.map(i => `<a href="${i.href}" class="block rounded-md px-3 py-2 text-sm text-muted-foreground hover:bg-surface hover:text-primary">${i.label}</a>`).join('');
    const overviewHtml = g.href ? `<a href="${g.href}" class="block rounded-md px-3 py-2 text-xs font-semibold text-primary hover:bg-surface">Ver visão geral ${ICON_ARROW}</a>` : '';
    return `<div class="border-b border-border py-1 last:border-b-0"><button type="button" class="mobile-nav-trigger flex w-full items-center justify-between rounded-md px-3 py-2.5 text-sm font-semibold text-foreground" aria-expanded="false" data-mobile-idx="${gi}">${g.label}${ICON_CHEVRON}</button><div id="mobile-panel-${gi}" class="pl-3" hidden>${itemsHtml}${overviewHtml}</div></div>`;
  }).join('');
  return `<header class="sticky top-0 z-50 border-b border-border bg-background/90 backdrop-blur"><div class="container-page flex h-16 items-center justify-between gap-4"><a aria-label="Nexalytix — página inicial" class="flex items-center gap-2" href="/"><span class="grid size-8 place-items-center rounded-md bg-primary text-sm font-bold text-primary-foreground">N</span><span class="font-display text-lg font-semibold tracking-tight">Nexalytix</span></a>
  <nav aria-label="Navegação principal" class="hidden items-center gap-1 lg:flex">
    ${navGroups}
  </nav>
  <div class="hidden lg:block">${btn('Fale com um especialista','/contato','primary')}</div>
  <button type="button" id="mobile-menu-btn" class="inline-flex size-10 items-center justify-center rounded-md border border-border lg:hidden" aria-expanded="false" aria-label="Abrir menu">${ICON_MENU}</button>
  </div>
  <div id="mobile-menu" class="border-t border-border bg-background lg:hidden" hidden><div class="container-page flex flex-col gap-1 py-3">
    ${mobileGroups}
    <a href="/contato" class="mt-2 rounded-md bg-primary px-3 py-2.5 text-center text-sm font-semibold text-primary-foreground">Fale com um especialista</a>
  </div></div>
  </header>`;
}

function footerHtml(){
  const col = (title, items) => `<div><h3 class="text-xs font-semibold uppercase tracking-[0.16em] text-ink-foreground/60">${title}</h3><ul class="mt-4 space-y-2">${items.map(i=>`<li><a href="${i.href}" class="text-sm text-ink-foreground/85 hover:text-ink-foreground">${i.label}</a></li>`).join('')}</ul></div>`;
  const [gEco, gSobre, gConteudo, gPessoas] = NAV_MEGA;
  return `<footer class="bg-ink text-ink-foreground"><div class="container-page grid gap-10 py-16 md:grid-cols-2 lg:grid-cols-5"><div class="lg:col-span-2"><span class="font-display text-xl font-semibold">Nexalytix</span><p class="mt-3 max-w-xs text-sm leading-relaxed text-ink-foreground/70">Ecossistema de tecnologia e inovação que transforma a adoção de jornadas digitais em valor para o seu negócio.</p><p class="mt-2 text-xs text-ink-foreground/50">Parte do <a href="/grupo-vieira-prime" class="underline hover:text-ink-foreground">Grupo Vieira Prime</a>.</p></div>
  ${col(gEco.label, gEco.items)}
  ${col(gSobre.label, gSobre.items)}
  ${col(gConteudo.label, gConteudo.items)}
  <div class="space-y-8">${col(gPessoas.label, gPessoas.items)}${col('Institucional', [{href:'/contato',label:'Contato'},{href:'/politica-de-privacidade',label:'Política de Privacidade'},{href:'/cookies',label:'Cookies'},{href:'/termos-de-uso',label:'Termos de Uso'}])}</div>
  </div><div class="border-t border-ink-foreground/10"><div class="container-page flex flex-col gap-2 py-6 text-xs text-ink-foreground/60 md:flex-row md:items-center md:justify-between"><p>© 2026 Nexalytix. Todos os direitos reservados.</p><p>Ecossistema de tecnologia e inovação que transforma a adoção de jornadas digitais em valor para o seu negócio.</p></div></div></footer>`;
}

function notFoundHtml(){
  return `<section class="flex flex-1 items-center justify-center py-24"><div class="container-page text-center"><p class="text-xs font-semibold uppercase tracking-[0.18em] text-primary">Erro 404</p><h1 class="mt-4 text-3xl font-semibold md:text-4xl">Página não encontrada</h1><p class="mx-auto mt-4 max-w-md text-base leading-relaxed text-muted-foreground">O endereço acessado não existe ou foi movido. Você pode voltar para a página inicial ou falar diretamente com nosso time.</p><div class="mt-8 flex flex-wrap justify-center gap-3">${btn('Ir para a home','/','primary')}${btn('Falar com um especialista','/contato','outline')}</div></div></section>`;
}

/* ============================= ROUTER ============================= */
function getPath(){
  let p = location.hash.slice(1) || '/';
  if (p.length > 1 && p.endsWith('/')) p = p.slice(0, -1);
  return p;
}

function render(){
  const path = getPath();
  const app = document.getElementById('app');
  let mainHtml, title;
  if (path === '/') {
    mainHtml = HOME_HERO + '<main>' + HOME_MAIN + '</main>';
    title = 'Nexalytix | Estratégia, IA e Transformação Digital';
  } else if (PAGES[path]) {
    mainHtml = '<main>' + PAGES[path].sections.join('') + '</main>';
    title = PAGES[path].title;
  } else {
    mainHtml = notFoundHtml();
    title = 'Página não encontrada | Nexalytix';
  }
  app.innerHTML = headerHtml() + '<div id="conteudo" class="flex-1">' + mainHtml + '</div>' + footerHtml();
  document.title = title;
  window.scrollTo(0, 0);

  // rewrite internal absolute links to hash links
  app.querySelectorAll('a[href^="/"]').forEach(a => {
    const href = a.getAttribute('href');
    a.setAttribute('href', '#' + href);
  });

  // highlight active nav
  app.querySelectorAll('nav a, #mobile-menu a').forEach(a => {
    if (a.getAttribute('href') === '#' + path) a.classList.add('text-primary');
  });

  // mobile menu toggle
  const menuBtn = document.getElementById('mobile-menu-btn');
  const menuPanel = document.getElementById('mobile-menu');
  if (menuBtn) menuBtn.addEventListener('click', () => {
    const open = menuBtn.getAttribute('aria-expanded') === 'true';
    menuBtn.setAttribute('aria-expanded', String(!open));
    menuPanel.hidden = open;
    menuBtn.innerHTML = open ? ICON_MENU : ICON_X;
  });

  // desktop mega-menu dropdowns
  app.querySelectorAll('.nav-trigger').forEach(b => {
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      const panel = document.getElementById('nav-panel-' + b.dataset.navIdx);
      const wasOpen = b.getAttribute('aria-expanded') === 'true';
      app.querySelectorAll('.nav-trigger').forEach(other => {
        other.setAttribute('aria-expanded','false');
        const p = document.getElementById('nav-panel-' + other.dataset.navIdx);
        if (p) p.hidden = true;
      });
      if (!wasOpen) { b.setAttribute('aria-expanded','true'); if (panel) panel.hidden = false; }
    });
  });

  // mobile accordion groups
  app.querySelectorAll('.mobile-nav-trigger').forEach(b => {
    b.addEventListener('click', () => {
      const panel = document.getElementById('mobile-panel-' + b.dataset.mobileIdx);
      const wasOpen = b.getAttribute('aria-expanded') === 'true';
      b.setAttribute('aria-expanded', String(!wasOpen));
      if (panel) panel.hidden = wasOpen;
    });
  });

  // faq accordions (single-open per group)
  app.querySelectorAll('.faq-btn').forEach(b => {
    b.addEventListener('click', () => {
      const group = b.dataset.faqGroup;
      const wasOpen = b.getAttribute('aria-expanded') === 'true';
      app.querySelectorAll('.faq-btn[data-faq-group="'+group+'"]').forEach(other => {
        other.setAttribute('aria-expanded','false');
        other.parentElement.nextElementSibling.hidden = true;
      });
      if (!wasOpen) {
        b.setAttribute('aria-expanded','true');
        b.parentElement.nextElementSibling.hidden = false;
      }
    });
  });

  // contact form
  const form = document.getElementById('contact-form');
  if (form) {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('cf-name').value, email = document.getElementById('cf-email').value, phone = document.getElementById('cf-phone').value, company = document.getElementById('cf-company').value, topic = document.getElementById('cf-topic').value, message = document.getElementById('cf-message').value;
      const submitBtn = document.getElementById('cf-submit');
      const note = document.getElementById('cf-note');

      function fallbackToMailto(){
        const subject = encodeURIComponent('Contato via site - ' + topic);
        const body = encodeURIComponent('Nome: ' + name + '\\nTelefone: ' + phone + '\\nEmpresa: ' + company + '\\nE-mail: ' + email + '\\nÁrea de interesse: ' + topic + '\\n\\n' + message);
        note.textContent = 'Abrindo seu aplicativo de e-mail com a mensagem preenchida...';
        note.hidden = false;
        window.location.href = 'mailto:contato@nexalytix.com.br?subject=' + subject + '&body=' + body;
      }

      if (!MAKE_WEBHOOK_URL || MAKE_WEBHOOK_URL.indexOf('COLOQUE_AQUI') !== -1) {
        fallbackToMailto();
        return;
      }

      submitBtn.disabled = true;
      note.hidden = true;

      const payload = {
        nome: name,
        email: email,
        telefone: phone,
        interesse: topic,
        produto: [topic],
        mensagem: message,
        origem: buildOrigem(),
        status: 'ldr',
        createdAt: new Date().toISOString(),
      };

      fetch(MAKE_WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      }).then((res) => {
        submitBtn.disabled = false;
        if (res.ok) {
          form.reset();
          note.textContent = 'Mensagem enviada! Nosso time responde em até 1 dia útil.';
          note.hidden = false;
        } else {
          fallbackToMailto();
        }
      }).catch(() => {
        submitBtn.disabled = false;
        fallbackToMailto();
      });
    });
  }
}

document.addEventListener('click', () => {
  document.querySelectorAll('.nav-trigger[aria-expanded="true"]').forEach(b => {
    b.setAttribute('aria-expanded','false');
    const p = document.getElementById('nav-panel-' + b.dataset.navIdx);
    if (p) p.hidden = true;
  });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    document.querySelectorAll('.nav-trigger[aria-expanded="true"]').forEach(b => {
      b.setAttribute('aria-expanded','false');
      const p = document.getElementById('nav-panel-' + b.dataset.navIdx);
      if (p) p.hidden = true;
    });
  }
});

window.addEventListener('hashchange', render);
render();
</script>
